services:
  - type: web
    name: dayflow-hrms
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: USE_SQLITE
        value: "True"
      - key: DATABASE_ENGINE
        value: "sqlite"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: PYTHON_VERSION
        value: "3.12.0"
