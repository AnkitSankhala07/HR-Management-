{% extends "base.html" %}{% block title %}Forgot password{% endblock %}
{% block body %}{% include "auth/_shell_top.html" %}
<h1>Reset your password</h1><p class="muted">We'll email you a secure link.</p>
<div id="msg" class="badge b-green hide" style="display:block;white-space:normal;margin-bottom:12px"></div>
<form id="f"><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><button class="btn block lg">Send reset link</button></form>
<p class="sm" style="margin-top:16px"><a href="/login/">Back to sign in</a></p></div></div>{% endblock %}
{% block scripts %}<script>fetch("/api/auth/csrf/");
document.getElementById("f").onsubmit=async e=>{e.preventDefault();try{const d=await DF.api("/api/auth/forgot-password/",{method:"POST",body:{email:email.value}});const m=document.getElementById("msg");m.textContent=d.message;m.classList.remove("hide")}catch(_){}};</script>{% endblock %}
