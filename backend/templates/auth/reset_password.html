{% extends "base.html" %}{% block title %}Set password{% endblock %}
{% block body %}{% include "auth/shell_top.html" %}
<h1>Choose a new password</h1>
<div id="msg" class="badge b-red hide" style="display:block;white-space:normal;margin:12px 0"></div>
<form id="f"><div class="field"><label for="password">New password</label><input id="password" type="password" required autocomplete="new-password"></div>
<div class="field"><label for="cp">Confirm password</label><input id="cp" type="password" required autocomplete="new-password"></div><button class="btn block lg">Update password</button></form>
</div></div>{% endblock %}
{% block scripts %}<script>fetch("/api/auth/csrf/");
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");
 try{await DF.api("/api/auth/reset-password/",{method:"POST",body:{token:"{{ token }}",password:password.value,confirm_password:cp.value},silent:true});DF.toast("Password updated","ok");setTimeout(()=>location.href="/login/",900)}
 catch(err){m.textContent=err.message+" "+Object.values(err.errors||{}).flat().join(" ");m.classList.remove("hide")}};</script>{% endblock %}
