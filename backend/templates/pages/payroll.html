{% extends "app_base.html" %}
{% block content %}
<div class="page-head"><div><h1>Payroll</h1><p>{% if is_payroll_admin %}Manage payroll for all employees{% else %}Your payroll — read only{% endif %}</p></div>
<div class="row auto">{% if is_payroll_admin %}<a class="btn secondary" href="/api/reports/payroll/?export=csv"><span data-lucide="download"></span> CSV</a><button class="btn" id="add"><span data-lucide="plus"></span> Add payroll</button>{% endif %}</div></div>
<div class="card"><div id="t"></div></div>
{% endblock %}
{% block scripts %}<script>
const ADMIN={{ is_payroll_admin|yesno:"true,false" }};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m,i)=>[i+1,m]);
const F=(upd)=>[...(upd?[]:[{name:"employee",label:"Employee",type:"select",optionsUrl:"/api/employees/?page_size=100",optionLabel:"full_name",required:true},{name:"pay_month",label:"Month",type:"select",options:MONTHS,required:true,value:new Date().getMonth()+1},{name:"pay_year",label:"Year",type:"number",required:true,value:new Date().getFullYear()}]),
 {name:"basic_salary",label:"Basic salary",type:"number",step:"0.01",min:0,required:true},{name:"hra",label:"HRA",type:"number",step:"0.01",min:0},{name:"allowances",label:"Allowances",type:"number",step:"0.01",min:0},{name:"bonus",label:"Bonus",type:"number",step:"0.01",min:0},{name:"deductions",label:"Deductions (tax/other)",type:"number",step:"0.01",min:0},
 {name:"payment_status",label:"Payment status",type:"select",options:[["PENDING","Pending"],["PAID","Paid"],["ON_HOLD","On hold"]],value:"PENDING"}];
const t=DF.table(document.getElementById("t"),{url:"/api/payroll/",ordering:"-pay_year",empty:"No payroll records yet.",
 filters:[{name:"month",label:"Month",options:MONTHS},{name:"payment_status",label:"Status",options:[["PENDING","Pending"],["PAID","Paid"],["ON_HOLD","On hold"]]}{% if is_payroll_admin %},{name:"department",label:"Department",optionsUrl:"/api/departments/"}{% endif %}],
 columns:[{% if is_payroll_admin %}{label:"Employee",render:r=>`<b>${DF.esc(r.employee_name)}</b><div class="muted sm">${DF.esc(r.employee_code)}</div>`},{% endif %}{label:"Period",sort:"pay_year",render:r=>MONTHS[r.pay_month-1][1]+" "+r.pay_year},{label:"Basic",render:r=>DF.money(r.basic_salary)},{label:"Gross",render:r=>DF.money(r.gross_salary)},{label:"Deductions",render:r=>DF.money(r.deductions)},{label:"Net",sort:"net_salary",render:r=>`<b>${DF.money(r.net_salary)}</b>`},{label:"Status",render:r=>DF.badge(r.payment_status)}],
 actions:r=>`<a class="btn secondary sm" href="/api/payroll/${r.id}/slip/">Salary slip</a>${ADMIN?` <button class="btn secondary sm" data-act="edit">Edit</button>`:""}`,
 onAction:(a,r)=>DF.form({title:"Update payroll",fields:F(true),initial:r,onSubmit:async b=>{await DF.api("/api/payroll/"+r.id+"/",{method:"PATCH",body:b});DF.toast("Payroll updated","ok");t.reload()}})});
if(ADMIN)document.getElementById("add").onclick=()=>DF.form({title:"Add payroll",fields:F(false),submit:"Create",onSubmit:async b=>{await DF.api("/api/payroll/",{method:"POST",body:b});DF.toast("Payroll created","ok");t.reload()}});
</script>{% endblock %}
