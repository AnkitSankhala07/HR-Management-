{% extends "app_base.html" %}
{% block content %}
<div class="page-head"><div><h1>Candidates & applications</h1><p>Search by name, email, job, skill or stage</p></div><a class="btn secondary" href="/api/reports/recruitment/?export=csv"><span data-lucide="download"></span> CSV</a></div>
<div class="card"><div id="t"></div></div>
{% endblock %}
{% block scripts %}<script>
DF.table(document.getElementById("t"),{url:"/api/applications/",ordering:"-applied_at",empty:"No applications yet.",
 filters:[{name:"job",label:"Job",optionsUrl:"/api/jobs/",optionLabel:"title"},{name:"stage",label:"Stage",options:["APPLIED","SCREENING","SHORTLISTED","INTERVIEW","OFFER","HIRED","REJECTED"].map(s=>[s,s])}],
 columns:[{label:"Candidate",render:r=>`<b>${DF.esc(r.candidate_name)}</b><div class="muted sm">${DF.esc(r.candidate_email)}</div>`},{label:"Job",key:"job_title"},{label:"Experience",render:r=>r.experience+" yrs"},{label:"Stage",render:r=>DF.badge(r.stage)},{label:"Applied",sort:"applied_at",render:r=>DF.date(r.applied_at)},{label:"Resume",render:r=>r.resume_url?`<a href="${r.resume_url}" target="_blank">View</a>`:"-"}]});
</script>{% endblock %}
